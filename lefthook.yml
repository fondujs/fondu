pre-commit:
  parallel: true
  commands:
    fmt:
      glob: '*.{ts,tsx,js,mjs,json,jsonc,css,md,yml}'
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,tsx,js,mjs}'
      run: bunx oxlint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
