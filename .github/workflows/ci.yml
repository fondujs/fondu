name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx oxfmt --check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run --filter create-fondu test # an app per target, built and served
