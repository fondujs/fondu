name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx oxfmt --check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run --filter create-fondu test # an app per target, built and served

  # a report, never a gate: the size of fondu's browser code, and on a pull request its change against the base branch
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun scripts/client-size.ts --json > head.json
      # the base, built with this branch's script (the base may not have one); no install: it shares node_modules
      - if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          git worktree add ../base FETCH_HEAD
          ln -s "$PWD/node_modules" ../base/node_modules
          if [ -d packages/fondu/node_modules ]; then ln -s "$PWD/packages/fondu/node_modules" ../base/packages/fondu/node_modules; fi
          bun scripts/client-size.ts ../base --json > base.json || echo "base: n/a (its build failed)"
      - run: bun scripts/client-size.ts --summary head.json ${{ github.event_name == 'pull_request' && 'base.json' || '' }} >> "$GITHUB_STEP_SUMMARY"

  # the Vite plugin's paths and the built server on Windows: the protocol tests, and an app on the Node target
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: node test/run.mjs node
        working-directory: packages/create-fondu

  # fondu/client against the browsers themselves (apps/conformance): Chromium, Firefox and WebKit
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's image: the three browsers and what they need installed already (@playwright/test's version), so
    # nothing is downloaded on each run
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    env:
      HOME: /root # Firefox, run as root in the container
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: npm install --global bun # the image has no unzip, which setup-bun needs
      - run: bun install --frozen-lockfile
      - run: bun run test
        working-directory: apps/conformance
      # what Playwright kept of a failing or flaky case: its error context, its trace
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: conformance-results
          path: apps/conformance/test-results/
          if-no-files-found: ignore
          retention-days: 7
