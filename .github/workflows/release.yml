# `bun run release` pushes a tag v*; this stages fondu and create-fondu (one version for both) on npm (trusted
# publishing: no token, with provenance) and writes the GitHub Release from the commits since the last tag. Each
# package goes live once a maintainer approves it with 2FA: npmjs.com → Staged Packages, or `npm stage approve <id>`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: cp README.md packages/fondu/
      - run: npm install -g npm@latest # `npm stage` needs npm 11.15 or later
      - run: npm stage publish
        working-directory: packages/fondu
      - run: npm stage publish
        working-directory: packages/create-fondu
      - run: bunx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
